lesson_hint: >
  注意 Gateway Cron 的 exec 路径默认使用 Shell（cmd.exe 在 Windows 下），
  node scripts/lesson-digest.mjs 的 cwd 要指向 D:\trae_git\Agents-Skill-Site\Code\code，
  否则 npm run lessons:scan 会因找不到 package.json 而失败。
  建议 Gateway 的 cron 命令写为：
  cd /d D:\trae_git\Agents-Skill-Site\Code\code && node scripts/lesson-digest.mjs
