lesson_hint: |
  registry.js 中 system/docs 声明 implemented:true（路径 /api/docs），
  但 server/routes/ 与 server/index.js 中均无 /api/docs 路由实现。
  这导致 openapiGenerator 生成的 OpenAPI 规范中包含 /api/docs 端点描述，
  而实际请求会 404。建议后续单独任务处理：
  A) 实现 /api/docs 路由（如 Redoc/Swagger UI 托管页），
  B) 或修正 registry.js 中 system/docs 的 implemented 为 false。
