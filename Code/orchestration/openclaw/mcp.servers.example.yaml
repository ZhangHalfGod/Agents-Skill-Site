# mcp.servers.example.yaml — MCP 挂进 OpenClaw 样例（四期 · SF-HS）
# 对应：Doc/phase4/04-tool-registration.md · 06-single-facade-hop-snapshot.md
# 密钥纪律：值只放 ~/.openclaw/.env 或 CLI --header；本文件只出现占位。
# 推荐挂接（已验证字段意图）：
#   openclaw mcp add agents-skill-remote \
#     --transport streamable-http \
#     --url "http://<PUBLIC_HOST>/agents-skill-mcp/mcp" \
#     --header "Authorization=Bearer <MCP_TOKEN>"

mcp:
  servers:
    agents-skill-remote:
      transport: streamable-http
      url: "http://<PUBLIC_HOST>/agents-skill-mcp/mcp"
      # 或 header Authorization=Bearer …（CLI --header）
      auth:
        type: bearer
        token_env: "MCP_TOKEN"

