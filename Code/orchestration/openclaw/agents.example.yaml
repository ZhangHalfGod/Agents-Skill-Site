# agents.example.yaml — 命名 agent + 模型分层（四期 4B，2026-07-29 本机实测通过）
# 对应契约：Doc/phase4/03-openclaw-route-table.md §2
#
# ✅ 已验证（bm，OpenClaw 2026.7.1-2）：
#   1. 命名 agent 注册：
#        openclaw agents add <id> --model <provider/model> --workspace <dir> --non-interactive
#      （自动写 openclaw.json + .bak；建 workspace（含 AGENTS.md/SOUL.md/USER.md/TOOLS.md）与 sessions 目录）
#   2. per-agent 模型绑定：注册时 --model；运行时也可 `openclaw agent --agent <id> --model <m>` 单次覆盖；
#      cron 任务级另有 `cron add --model/--fallbacks`
#   3. auth 隔离：每 agent 独立 auth store（agents/<id>/agent/openclaw-agent.sqlite），
#      不继承 gateway 进程 env；须逐 agent 注入：
#        <key> | openclaw models auth --agent <id> paste-api-key --provider <provider>
#   4. persona 注入：workspace 的 SOUL.md / AGENTS.md（本仓 prompts/role-session.md 的精简锚定版）
#   5. 唤起：openclaw agent --agent <id> --message "..."（--session-key agent:<id>:<key> 可显式控会话）
#   6. 删除：openclaw agents delete <id>（连 workspace/state 一起清）
#
# bm 当前花名册（2026-07-29 已建，全部 deepseek/deepseek-v4-flash）：
#   main（default）+ pm / arch / ui / dev / test / sec / ops —— 与本文件 agents: 段一一对应。
#
# ⚠ 已知行为：CLI 唤起偶发 Gateway 1006 abnormal closure，自动回退 embedded agent 完成本轮；
#    编排者应把「失败重试一次」作为默认策略。

agents:
  main:                              # 编排者：收消息、校验信封、按路由表唤起下一跳
    persona: prompts/orchestrator-main.md
    model_tier: mid                  # 意图分层；当前实际统一绑 flash
    model: "deepseek/deepseek-v4-flash"
    skills:
      - route-dispatch               # ✅ 已有（V4）
      - switch-dashscope-model       # ✅ 已有

  pm:                                # H1 ProductManager
    persona_source: "docs/zh/agents/standard/ProductManager/index.md"   # SOUL.md 锚定此路径
    model_tier: top
    model: "deepseek/deepseek-v4-flash"

  arch:                              # H2 Architect
    persona_source: "docs/zh/agents/standard/Architect/index.md"
    model_tier: top
    model: "deepseek/deepseek-v4-flash"

  ui:                                # H2b UIDesigner（并行可选）
    persona_source: "docs/zh/agents/standard/UIDesigner/index.md"
    model_tier: mid
    model: "deepseek/deepseek-v4-flash"

  dev:                               # H3 DevLead；代码产出走机制 B（Cursor CLI headless）
    persona_source: "docs/zh/agents/standard/DevLead/index.md"
    model_tier: mid
    model: "deepseek/deepseek-v4-flash"
    skills:
      - code-via-cursor-cli          # ✅ 已有（V5）

  test:                              # H4 TestEngineer
    persona_source: "docs/zh/agents/standard/TestEngineer/index.md"
    model_tier: mid
    model: "deepseek/deepseek-v4-flash"

  sec:                               # H5 SecurityEngineer
    persona_source: "docs/zh/agents/standard/SecurityEngineer/index.md"
    model_tier: mid
    model: "deepseek/deepseek-v4-flash"

  ops:                               # H6 OpsEngineer；M3 人工放行后才执行部署动作
    persona_source: "docs/zh/agents/standard/OpsEngineer/index.md"
    model_tier: mid
    model: "deepseek/deepseek-v4-flash"

# 模型分层原则（亮点文档 §1.2）：top=核心决策（pm/arch）；mid=执行类；econ=文档类（DeepSeek）。
# 试点期统一 deepseek-v4-flash；后续分档由用户绑定——改法：
#   openclaw agents delete <id> 重建带新 --model，或待官方 per-agent 改型命令；
#   临时单跳覆盖用 openclaw agent --agent <id> --model <m>。
# bm 已注册备选模型：qwen/qwen3.7-max 系、qwen-oauth/*、deepseek/deepseek-v4-pro 等（openclaw models list）。
# 四期不做自动调配（优先级③再做数据反馈闭环）。
